<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles1.css">
</head>
<body>
    <div id="container">
        <h1>Rock Paper Scissors Game</h1>
        <div id="choices">
            <div>
                <img id="rock" src="rock.jpg">
            </div>
            <div>
                <img id="paper" src="paper.jpg">
            </div>
            <div>
                <img id="scissors" src="scissors.jpg">
            </div>
        </div>
        <div id="score">
            <div id="playerscore">
                <p>0</p>
            </div>
            <div id="display">
                <p>Click the one you want</p>
            </div>
            <div id="computerscore">
                <p>0</p>
            </div>
        </div>
        <div id="fixscore">
            <div id="uscore">
                <p>Your<br>Score</p>
            </div>
            <div id="cscore">
                <p>Comp<br>Score</p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="script1.js"></script>
</body>
</html>
